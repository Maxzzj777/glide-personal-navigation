<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef4ff">
  <title>Glide · 个人导航</title>
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="app-shell">
    <aside class="sidebar glass" id="sidebar" aria-label="网站分类">
      <div class="brand"><span class="brand-mark">G</span><span>Glide</span><button class="icon-button mobile-only" id="closeSidebar" aria-label="关闭分类">×</button></div>
      <nav id="categoryList" class="category-list"></nav>
      <button class="add-category admin-only" id="addCategory"><span>＋</span> 新建分类</button>
      <div class="sidebar-footer">
        <button class="icon-button" id="themeButton" title="切换主题" aria-label="切换主题">◐</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main">
      <header class="topbar">
        <button class="icon-button glass mobile-only" id="openSidebar" aria-label="打开分类">☰</button>
        <div class="search glass"><span>⌕</span><input id="searchInput" type="search" placeholder="搜索网站或网址…" autocomplete="off"><kbd>⌘ K</kbd></div>
        <button class="add-site primary admin-only" id="addSite">＋ <span>添加网站</span></button>
      </header>
      <section class="hero">
        <p class="eyebrow">MY START PAGE</p>
        <h1 id="pageTitle">常用</h1>
        <p id="siteCount">0 个网站</p>
      </section>
      <div class="site-sections" id="siteGrid" aria-live="polite"></div>
      <div class="empty-state" id="emptyState" hidden><div class="empty-icon">✦</div><h2>这里还没有网站</h2><p>添加一个常用网站，或从其他分类拖进来。</p><button class="primary" id="emptyAdd">添加第一个网站</button></div>
      <nav class="bottom-nav glass" aria-label="底部导航"><a href="https://github.com/Maxzzj777/glide-personal-navigation" target="_blank" rel="noopener" aria-label="打开 GitHub 项目"><span>⌘</span><b>GitHub</b></a><button class="admin-only" id="backgroundButton" aria-label="更换网页背景"><span>▧</span><b>背景</b></button><button id="adminToggle" aria-label="管理员开关"><span>◇</span><b id="adminLabel">管理员</b></button></nav>
    </main>
  </div>

  <dialog id="siteDialog" class="modal glass">
    <form id="siteForm" method="dialog">
      <div class="modal-head"><div><p class="eyebrow">QUICK EDIT</p><h2 id="siteDialogTitle">添加网站</h2></div><button class="icon-button" id="siteClose" type="button" aria-label="关闭新增收藏">×</button></div>
      <input type="hidden" id="siteId">
      <label>名称<input id="siteName" required maxlength="40" placeholder="例如：Apple"></label>
      <label>网址<input id="siteUrl" required type="url" placeholder="https://apple.com"></label>
      <label>图标 <small>可填 emoji、图片网址，留空则显示首字母</small><input id="siteIcon" placeholder=" 或 https://…"></label>
      <label>详情备注 <small>鼠标悬停卡片时显示</small><input id="siteDetail" maxlength="100" placeholder="例如：工作常用账号、使用说明等"></label>
      <label>分类<select id="siteCategory"></select></label>
      <div class="modal-actions"><button class="danger ghost" type="button" id="deleteSite" hidden>删除</button><span></span><button class="ghost" id="siteCancel" type="button">取消</button><button class="primary" type="submit">保存</button></div>
    </form>
  </dialog>

  <dialog id="categoryDialog" class="modal glass small-modal">
    <form id="categoryForm" method="dialog">
      <div class="modal-head"><h2 id="categoryDialogTitle">新建分类</h2><button class="icon-button" id="categoryClose" type="button" aria-label="关闭新建分组">×</button></div>
      <input type="hidden" id="categoryId">
      <label>分类名称<input id="categoryName" required maxlength="20" placeholder="例如：阅读"></label>
      <div class="modal-actions"><button class="danger ghost" type="button" id="deleteCategory" hidden>删除</button><span></span><button class="ghost" id="categoryCancel" type="button">取消</button><button class="primary" type="submit">保存</button></div>
    </form>
  </dialog>

  <dialog id="adminDialog" class="modal glass small-modal">
    <form id="adminForm" method="dialog">
      <div class="modal-head"><div><p class="eyebrow">ADMIN ACCESS</p><h2>管理员登录</h2></div><button class="icon-button" id="adminClose" type="button" aria-label="关闭管理员登录">×</button></div>
      <label>账号<input id="adminUser" required autocomplete="username" placeholder="请输入管理员账号"></label>
      <label>密码<input id="adminPassword" required type="password" autocomplete="current-password" placeholder="请输入管理员密码"></label>
      <p class="form-error" id="adminError" hidden>账号或密码错误</p>
      <div class="modal-actions"><span></span><button class="ghost" value="cancel">取消</button><button class="primary" type="submit">登录</button></div>
    </form>
  </dialog>

  <dialog id="backgroundDialog" class="modal glass">
    <form id="backgroundForm" method="dialog">
      <div class="modal-head"><div><p class="eyebrow">APPEARANCE</p><h2>更换网页背景</h2></div><button class="icon-button" id="backgroundClose" type="button" aria-label="关闭背景设置">×</button></div>
      <label>图片链接<input id="backgroundUrl" type="url" placeholder="https://example.com/background.jpg"></label>
      <div class="background-preview" id="backgroundPreview"><span>背景预览</span></div>
      <p class="background-hint">请使用可公开访问的 HTTPS 图片链接。</p>
      <div class="modal-actions"><button class="danger ghost" type="button" id="resetBackground">恢复默认</button><span></span><button class="ghost" value="cancel">取消</button><button class="primary" type="submit">应用背景</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="reference-data.js?v=5"></script>
  <script src="details-data.js?v=5"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
