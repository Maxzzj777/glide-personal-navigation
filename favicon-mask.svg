<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 简化的 G 形状：外圆 + 内圆挖空（用 evenodd 形成环形） + 底部横杠 -->
  <path d="M 50 5 A 45 45 0 1 0 50 95 A 45 45 0 1 0 50 5 Z
           M 50 25 A 25 25 0 1 1 50 75 A 25 25 0 1 1 50 25 Z"
        fill="black" fill-rule="evenodd"/>
  <!-- 底部横杠（G 字符特征） -->
  <rect x="50" y="46" width="22" height="8" fill="black"/>
</svg>
